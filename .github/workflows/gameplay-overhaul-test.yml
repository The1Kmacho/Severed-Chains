name: Gameplay Overhaul Development Build

on:
  push:
    branches:
      - gameplay-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out gameplay milestone
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle

      - name: Build Windows package
        shell: pwsh
        run: .\gradlew.bat clean jar --stacktrace

      - name: Add gameplay test notes
        shell: pwsh
        run: |
          @"
          Severed Chains - Gameplay Overhaul Development Build

          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA

          INCLUDED MOD
          - mods/gameplay-overhaul.jar

          FIRST MILESTONE
          - Successful additions: +10% innate-element bonus damage
          - Final additions: +25% innate-element bonus + character-specific effect
          - Shana/Miranda normal attack: Light bonus + 10% self-heal
          - Parry: existing Counter input, tight timing window
          - Dodge: new Dodge input, default keyboard C / controller X
          - Successful Dragoon attack circles grant selected-addition XP
          - Addition menu displays gameplay-overhaul effect descriptions

          This is an experimental gameplay test build. Keep it separate from your normal install.
          "@ | Set-Content -Path build\libs\GAMEPLAY_OVERHAUL_TESTING.txt

      - name: Upload runnable Windows gameplay build
        uses: actions/upload-artifact@v4
        with:
          name: Severed-Chains-Gameplay-Overhaul-Windows
          path: build/libs/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
