name: Combined Development Build

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-test-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle

      - name: Build Windows package
        shell: pwsh
        run: .\gradlew.bat clean jar --stacktrace

      - name: Add test-build notes
        shell: pwsh
        run: |
          @"
          Severed Chains - Combined Development Build

          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA

          HOW TO RUN
          1. Extract this artifact to a normal writable folder.
          2. Copy your Legend of Dragoon disc images into the isos folder as required by Severed Chains.
          3. Double-click launch.bat.
          4. On first launch, launch.bat will download Java 25 automatically if jdk25 is not already present.
          5. In Options > Postprocessing, enable "Visual Remaster".
          6. Keep CRT Enabled off when testing the remaster renderer.

          INCLUDED MODS
          - mods/visual-remaster.jar
          - mods/gameplay-overhaul.jar
          - mods/field-battle-models.jar
          - mods/visible-encounters.jar

          This artifact is produced only from the development branch.
          Feature work remains isolated on its work branches until intentionally integrated.
          "@ | Set-Content -Path build\libs\VISUAL_REMASTER_TESTING.txt

      - name: Upload runnable Windows development build
        uses: actions/upload-artifact@v4
        with:
          name: Severed-Chains-Combined-Development-Windows
          path: build/libs/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  android-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 25 for Severed Chains
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle

      - name: Prepare Android game payload
        run: |
          chmod +x ./gradlew
          ./gradlew clean prepareAndroidRuntime \
            -PandroidRuntime=true \
            -PlwjglVersion=3.4.1 \
            --stacktrace
          rm -rf android/app/src/main/assets/game android/app/src/main/assets/runtime
          mkdir -p android/app/src/main/assets/game android/app/src/main/assets/runtime
          cp -a build/android-game/. android/app/src/main/assets/game/

      - name: Download Android OpenJDK 25 runtime
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          workflow_conclusion: completed
          repo: FCL-Team/Android-OpenJDK-Build
          branch: Build_JRE_25
          name: jre25-multiarch
          path: android/app/src/main/assets/runtime

      - name: Verify Android JRE payload
        run: |
          test -f android/app/src/main/assets/runtime/universal.tar.xz
          test -f android/app/src/main/assets/runtime/bin-arm64.tar.xz
          ls -lh android/app/src/main/assets/runtime

      - name: Fetch pinned Android native dependencies
        run: |
          chmod +x android/scripts/fetch-mobile-deps.sh
          android/scripts/fetch-mobile-deps.sh

      - name: Set up Java 17 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Android ARM64 debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload Android development APK
        uses: actions/upload-artifact@v4
        with:
          name: Severed-Chains-Combined-Development-Android-ARM64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
