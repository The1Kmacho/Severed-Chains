name: Combined Development Build

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle

      - name: Build Windows package
        shell: pwsh
        run: .\gradlew.bat clean jar --stacktrace

      - name: Add test-build notes
        shell: pwsh
        run: |
          @"
          Severed Chains - Combined Development Build

          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA

          HOW TO RUN
          1. Extract this artifact to a normal writable folder.
          2. Copy your Legend of Dragoon disc images into the isos folder as required by Severed Chains.
          3. Double-click launch.bat.
          4. On first launch, launch.bat will download Java 25 automatically if jdk25 is not already present.
          5. In Options > Postprocessing, enable "Visual Remaster".
          6. Keep CRT Enabled off when testing the remaster renderer.

          INCLUDED MODS
          - mods/visual-remaster.jar
          - mods/gameplay-overhaul.jar
          - mods/field-battle-models.jar

          This artifact is produced only from the development branch.
          Feature work remains isolated on its work branches until intentionally integrated.
          "@ | Set-Content -Path build\libs\VISUAL_REMASTER_TESTING.txt

      - name: Upload runnable Windows development build
        uses: actions/upload-artifact@v4
        with:
          name: Severed-Chains-Combined-Development-Windows
          path: build/libs/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
